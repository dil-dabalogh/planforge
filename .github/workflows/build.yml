name: Build PlanForge Distribution

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planforge-distribution
          path: dist/
          retention-days: 30
          
      - name: Commit and push built files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are any changes in dist/
          if [ -n "$(git status --porcelain dist/)" ]; then
            git add dist/
            git commit -m "chore: Auto-build distribution files [skip ci]"
            git push
          else
            echo "No changes to commit in dist/"
          fi
          
      - name: Display build info
        run: |
          echo "✅ Build completed successfully!"
          echo "📁 Distribution file: dist/index.html"
          echo "📊 File size:"
          ls -lh dist/index.html
          echo ""
          echo "🔒 Features:"
          echo "  • Obfuscated JavaScript code"
          echo "  • Embedded Material Icons fonts"
          echo "  • Minified CSS"
          echo "  • Single self-contained file"
          echo ""
          echo "🚀 Ready for deployment!"
