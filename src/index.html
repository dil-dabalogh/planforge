    <link rel="stylesheet" href="./assets/fonts/css/material-icons.css" />
    <link rel="stylesheet" href="./assets/fonts/css/material-symbols-outlined-simple.css" />
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand" aria-label="WHAT IF delivered">
        <span class="logo-mark">•</span>
        <span class="logo-word">
          <span class="logo-strong">WHAT IF</span>
          <span class="logo-light">delivered</span>
        </span>
      </div>
      <div class="toolbar">
        <div class="spacer"></div>
        <button id="btn-erase" title="Clear All Data" class="icon-only-button btn btn--icon btn-danger">
          <span class="material-icons">delete</span>
        </button>
        <button id="btn-import" title="Import JSON File" class="icon-only-button btn btn--icon">
          <span class="material-icons">folder_open</span>
        </button>
        <button id="btn-export" title="Export Data" class="icon-only-button btn btn--icon">
          <span class="material-icons">download</span>
        </button>
        <button id="btn-share" title="Share" class="icon-only-button btn btn--icon">
          <span class="material-icons">share</span>
        </button>
        <button id="btn-settings" title="Settings" class="icon-only-button btn btn--icon">
          <span class="material-icons">settings</span>
        </button>
        <button id="btn-info" title="About WHAT IF delivered" class="icon-only-button btn btn--icon">
          <span class="material-icons">info</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <aside class="sidebar" id="left-sidebar">
        <div class="sidebar-toggle" id="left-sidebar-toggle">
          <button id="toggle-left-panel" title="Collapse Hierarchy Panel">
            <span class="material-icons">chevron_left</span>
          </button>
        </div>
        <div class="sidebar-content">
          <div class="pane">
            <h2>Hierarchy</h2>
            <div id="hierarchy-tree" class="tree"></div>
          </div>
        </div>
      </aside>

      <section class="workspace">
        <h1 class="visually-hidden">Free for life, offline Gantt Chart Editor | WHAT IF delivered</h1>
        <div id="timeline-container">
          <canvas id="timeline-canvas"></canvas>
        </div>
        <div class="timeline-controls-bottom">
            <div class="timeline-controls">
              <label><span class="label-pill">Timeline Start</span>
              <input id="timeline-start" type="date" class="input" />
            </label>
              <label><span class="label-pill">Timeline End</span>
              <input id="timeline-end" type="date" class="input" />
            </label>
          </div>
          
          <div class="zoom-controls">
            <div class="zoom-presets" role="tablist" aria-label="Zoom levels">
              <button id="zoom-year" class="zoom-preset btn" role="tab" aria-selected="false" title="Year View">Year</button>
              <button id="zoom-quarter" class="zoom-preset btn" role="tab" aria-selected="false" title="Quarter View">Quarter</button>
              <button id="zoom-month" class="zoom-preset btn" role="tab" aria-selected="true" title="Month View">Month</button>
              <button id="zoom-week" class="zoom-preset btn" role="tab" aria-selected="false" title="Week View">Week</button>
              <button id="zoom-day" class="zoom-preset btn" role="tab" aria-selected="false" title="Day View">Day</button>
              <button id="zoom-today" class="btn" title="Jump to today">Today</button>
            </div>
            <div class="zoom-slider-container">
              <label for="zoom-slider" class="zoom-label">Zoom:</label>
              <input id="zoom-slider" type="range" min="0" max="4" value="2" step="1" aria-label="Zoom level" />
              <span id="zoom-level" class="zoom-level">Month</span>
              <button id="zoom-to-content" class="zoom-to-content-btn btn btn--icon" title="Fit to content" disabled>
                <span class="material-symbols-outlined">fit_screen</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <aside class="sidebar" id="right-sidebar">
        <div class="sidebar-toggle" id="right-sidebar-toggle">
          <button id="toggle-right-panel" title="Collapse Details Panel">
            <span class="material-icons">chevron_right</span>
          </button>
        </div>
        <div class="sidebar-content">
          <div class="pane">
            <h2>Details</h2>
            <div id="details"></div>
          </div>
        </div>
      </aside>
    </main>

    <input id="file-input" type="file" accept=".json,.yaml,.yml,application/json,text/yaml" style="display:none" />

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu">
      <div id="context-menu-items" class="context-menu-items" role="menu" aria-label="Context menu"></div>
    </div>

    <!-- MermaidJS Export Dialog -->
    <div id="mermaid-dialog" class="dialog-overlay" style="display: none;">
      <div class="dialog-content">
        <div class="dialog-header">
          <h3>MermaidJS Gantt Chart</h3>
          <button id="close-mermaid-dialog" class="dialog-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="dialog-body">
          <p>Copy the code below to embed this Gantt chart in your documentation:</p>
          <textarea id="mermaid-code" readonly></textarea>
          <div class="dialog-actions">
            <button id="copy-mermaid-code" class="btn-primary">
              <span class="material-icons">content_copy</span>
              Copy to Clipboard
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Info Dialog -->
    <div id="info-dialog" class="dialog-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <div class="dialog-content info-dialog-content">
        <div class="dialog-header">
          <h3 id="info-title">About WHAT IF delivered</h3>
          <button id="close-info-dialog" class="dialog-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="dialog-body">
          <div id="info-content">
            <!-- Content will be populated here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settings-dialog" class="dialog-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="dialog-content">
        <div class="dialog-header">
          <h3 id="settings-title">Settings</h3>
          <button id="close-settings-dialog" class="dialog-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
        <div class="dialog-body">
          <div id="settings-content">
            <!-- Content will be populated here -->
          </div>
        </div>
      </div>
    </div>
