<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Primary Meta Tags -->
    <title>Free Gantt Chart Editor | PlanForge - Offline Project Planner</title>
    <meta name="title" content="Free Gantt Chart Editor | PlanForge - Offline Project Planner">
    <meta name="description" content="Free, open-source Gantt chart editor. Works offline, exports to MermaidJS/JSON. No tracking, your data stays private.">
    <meta name="keywords" content="gantt chart, project planner, mermaidjs, gantt chart editor, offline project management, open source project planner, free gantt chart, jira export, scenario planning, project timeline">
    <meta name="author" content="PlanForge">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://planforge.cc/">
    <meta property="og:title" content="Free Gantt Chart Editor | PlanForge - Offline Project Planner">
    <meta property="og:description" content="Free, open-source Gantt chart editor. Works offline, exports to MermaidJS/JSON. No tracking, your data stays private.">
    
    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://planforge.cc/">
    <meta property="twitter:title" content="Free Gantt Chart Editor | PlanForge - Offline Project Planner">
    <meta property="twitter:description" content="Free, open-source Gantt chart editor. Works offline, exports to MermaidJS/JSON. No tracking, your data stays private.">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://planforge.cc/">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z' fill='%231976d2'/%3E%3C/svg%3E">
    
    <!-- Schema.org Structured Data for SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PlanForge",
      "url": "https://planforge.cc",
      "description": "Free, open-source Gantt chart editor for project planning. Works completely offline, exports to MermaidJS and JSON.",
      "applicationCategory": "ProjectManagementSoftware",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "softwareFeature": [
        "Gantt chart visualization",
        "Offline functionality",
        "MermaidJS export",
        "JSON export",
        "Scenario planning"
      ],
      "creator": {
        "@type": "Person",
        "name": "David Balogh"
      },
      "isAccessibleForFree": true,
      "license": "https://github.com/dil-dabalogh/planforge"
    }
    </script>
    
    <link rel="stylesheet" href="./assets/fonts/css/material-icons.css" />
    <link rel="stylesheet" href="./assets/fonts/css/material-symbols-outlined-simple.css" />
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">PlanForge</div>
      <div class="toolbar">
        <div class="spacer"></div>
        <button id="btn-import" title="Import JSON File">
          <span class="material-icons">folder_open</span>
          Import
        </button>
        <button id="btn-export" title="Export Data">
          <span class="material-icons">download</span>
          Export
        </button>
        <button id="btn-settings" title="Settings" class="icon-only-button">
          <span class="material-icons">settings</span>
        </button>
        <button id="btn-info" title="About PlanForge" class="icon-only-button">
          <span class="material-icons">info</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <aside class="sidebar" id="left-sidebar">
        <div class="pane">
          <h2>Hierarchy</h2>
          <div id="hierarchy-tree" class="tree"></div>
        </div>
      </aside>

      <section class="workspace">
        <h1 class="visually-hidden">Free for life, offline Gantt Chart Editor | PlanForge</h1>
        <div id="timeline-container">
          <canvas id="timeline-canvas"></canvas>
        </div>
        <div class="timeline-controls-bottom">
          <div class="timeline-controls">
            <label>Timeline Start
              <input id="timeline-start" type="date" />
            </label>
            <label>Timeline End
              <input id="timeline-end" type="date" />
            </label>
          </div>
          
          <div class="zoom-controls">
            <div class="zoom-presets">
              <button id="zoom-year" class="zoom-preset" title="Year View">Year</button>
              <button id="zoom-quarter" class="zoom-preset" title="Quarter View">Quarter</button>
              <button id="zoom-month" class="zoom-preset" title="Month View">Month</button>
              <button id="zoom-day" class="zoom-preset" title="Day View">Day</button>
            </div>
            <div class="zoom-slider-container">
              <label for="zoom-slider" class="zoom-label">Zoom:</label>
              <input id="zoom-slider" type="range" min="0" max="4" value="2" step="1" aria-label="Zoom level" />
              <span id="zoom-level" class="zoom-level">Month</span>
              <button id="zoom-to-content" class="zoom-to-content-btn" title="Fit to content" disabled>
                <span class="material-symbols-outlined">fit_screen</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <aside class="sidebar" id="right-sidebar">
        <div class="sidebar-toggle" id="right-sidebar-toggle">
          <button id="toggle-right-panel" title="Toggle Details Panel">
            <span class="material-symbols-outlined">keyboard_double_arrow_left</span>
          </button>
        </div>
        <div class="sidebar-content">
          <div class="pane">
            <h2>Details</h2>
            <div id="details"></div>
          </div>
        </div>
      </aside>
    </main>

    <input id="file-input" type="file" accept=".json,.yaml,.yml,application/json,text/yaml" style="display:none" />

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu">
      <div id="context-menu-items" class="context-menu-items"></div>
    </div>

    <!-- MermaidJS Export Dialog -->
    <div id="mermaid-dialog" class="dialog-overlay" style="display: none;">
      <div class="dialog-content">
        <div class="dialog-header">
          <h3>MermaidJS Gantt Chart</h3>
          <button id="close-mermaid-dialog" class="dialog-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="dialog-body">
          <p>Copy the code below to embed this Gantt chart in your documentation:</p>
          <textarea id="mermaid-code" readonly></textarea>
          <div class="dialog-actions">
            <button id="copy-mermaid-code" class="btn-primary">
              <span class="material-icons">content_copy</span>
              Copy to Clipboard
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Info Dialog -->
    <div id="info-dialog" class="dialog-overlay" style="display: none;">
      <div class="dialog-content info-dialog-content">
        <div class="dialog-header">
          <h3>About PlanForge</h3>
          <button id="close-info-dialog" class="dialog-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="dialog-body">
          <div id="info-content">
            <!-- Content will be populated here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settings-dialog" class="dialog-overlay" style="display: none;">
      <div class="dialog-content">
        <div class="dialog-header">
          <h3>Settings</h3>
          <button id="close-settings-dialog" class="dialog-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="dialog-body">
          <div id="settings-content">
            <!-- Content will be populated here -->
          </div>
        </div>
      </div>
    </div>




    <script src="./js/model.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/timeline.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
  </body>
  </html>
